<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="BikePro ERP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#cbd5e1"/>
      <stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4d4d"/>
      <stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="88" fill="none" stroke="#ef4444" stroke-width="6" opacity=".9"/>

  <!-- speedometer -->
  <path d="M117 224a143 143 0 0 1 278 0" fill="none" stroke="#e5e7eb" stroke-width="12" opacity=".9"/>
  <path d="M137 215a123 123 0 0 1 238 0" fill="none" stroke="#ef4444" stroke-width="10" stroke-linecap="round"/>
  <path d="M256 204l72-72" stroke="#ef4444" stroke-width="12" stroke-linecap="round"/>
  <circle cx="256" cy="204" r="12" fill="#fff"/>

  <!-- gear -->
  <g transform="translate(92 158)" fill="none" stroke="url(#silver)" stroke-width="15" opacity=".95">
    <circle cx="0" cy="0" r="39"/>
    <circle cx="0" cy="0" r="13"/>
    <path d="M0-62v-22M0 62v22M-62 0h-22M62 0h22M-44-44l-16-16M44 44l16 16M44-44l16-16M-44 44l-16 16" stroke-linecap="round"/>
  </g>

  <!-- wrench -->
  <g transform="translate(397 155) rotate(35)" fill="none" stroke="url(#red)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-8-36a35 35 0 0 0 42 45L5 38l-43-43 29-29A35 35 0 0 0-8-36z"/>
    <circle cx="5" cy="38" r="7" fill="#0b1220" stroke-width="10"/>
  </g>

  <!-- motorcycle -->
  <g filter="url(#shadow)">
    <circle cx="172" cy="296" r="47" fill="#0b1220" stroke="url(#silver)" stroke-width="8"/>
    <circle cx="340" cy="296" r="47" fill="#0b1220" stroke="url(#silver)" stroke-width="8"/>
    <circle cx="172" cy="296" r="18" fill="#334155" stroke="#fff" stroke-width="5"/>
    <circle cx="340" cy="296" r="18" fill="#334155" stroke="#fff" stroke-width="5"/>

    <path d="M171 286l45-62 72 2 42 70h-42l-31-40-34 31 35 9h-87z" fill="url(#silver)"/>
    <path d="M212 224l43-45 46 9 23 38-45-2-27 25z" fill="#f8fafc"/>
    <path d="M256 181l40 8 18 29-49-2z" fill="#111827"/>
    <path d="M216 225l54 0 35 21-34 10-47-9z" fill="url(#red)"/>
    <path d="M286 228l37 4 25 38-28 0-21-25z" fill="#111827"/>
    <path d="M230 263l-28 35h-28l20-44z" fill="#111827"/>
    <path d="M316 245l30 10 18 41h-28l-18-28z" fill="#111827"/>
    <path d="M268 201l23 3 16 18-35-3z" fill="#60a5fa" opacity=".95"/>
    <path d="M203 254l-28 0" stroke="#ef4444" stroke-width="8" stroke-linecap="round"/>
    <path d="M323 230l27-15" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
    <path d="M348 213l18 9" stroke="#e5e7eb" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- branding -->
  <text x="256" y="382" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" font-style="italic" letter-spacing="-2" fill="#fff">BIKE<tspan fill="#ef4444">PRO</tspan></text>
  <path d="M105 398h302" stroke="#ef4444" stroke-width="4"/>
  <text x="256" y="438" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="37" font-weight="800" letter-spacing="9" fill="url(#silver)">ERP</text>
</svg>
